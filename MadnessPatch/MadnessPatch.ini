[Fixes]
; Prevents hair physics simulation instability at high framerates
; 0 = Disabled, 1 = Enabled
FixHighFPSHairPhysics = 1

; Prevents cloth physics simulation instability at high framerates
; 0 = Disabled, 1 = Enabled
FixHighFPSClothPhysics = 1

; Fixes pepper grinder projectile hitboxes being inconsistent at high FPS
; 0 = Disabled, 1 = Enabled
FixHighFPSProjectileCollisionCheck = 1

; Fixes PhysX simulation at high framerates
; 0 = Disabled, 1 = Enabled
FixHighFPSPhysX = 1

; Fixes player movement bleeding speed or snapping to a fall when grazing walls at high framerates
; 0 = Disabled, 1 = Enabled
FixHighFPSWalkingPhysics = 1

; Enables a collection of fixes for known crashes and infinite loading screens
; 0 = Disabled, 1 = Enabled
CrashFixes = 1

; Fix a crash that might happen when PhysX is enabled in CPU mode
; 0 = Disabled, 1 = Enabled
FixCPUPhysX = 1

; Resolves input binding issues for certain keys that may not respond correctly
; 0 = Disabled, 1 = Enabled
FixInputBinding = 1

; Enables proper window management support (ALT+F4, alt-tabbing)
; 0 = Disabled, 1 = Enabled
FixWindowHandling = 1

; Prevents the camera lock-on from sticking during Hysteria mode
; 0 = Disabled, 1 = Enabled
HysteriaLockOnGuard = 1

; Flushes input after load transitions so keys do not get stuck
; 0 = Disabled, 1 = Enabled
FixStuckKeys = 1

; Restores area music that fails to start when spawning past its trigger
; 0 = Disabled, 1 = Enabled
FixMissingMusic = 1

; Repairs unfinished actor properties left in several levels
; 0 = Disabled, 1 = Enabled
FixMapProperties = 1

; Fixes the Chapter 1 Hatter elevator softlock where the pressure pad stops responding on a return visit, and repairs saves already affected by it
; 0 = Disabled, 1 = Enabled
FixHatterElevator = 1

; Makes full screen fades reach true black instead of leaving the scene faintly visible
; 0 = Disabled, 1 = Enabled
FixFadeToBlack = 1

; Stops the weapon from popping into Alice's hand on the first attack press in states where she can't attack
; 0 = Disabled, 1 = Enabled
FixWeaponSwitchFadeIn = 1

; Caps the framerate of one cutscene to avoid an otherwise sudden frame-rate drop during it
; 0 = Disabled, 1 = Enabled
CutsceneFPSCap = 1

; Removes the leaked HUD cursor sprite left by the first weapon-upgrade popup
; 0 = Disabled, 1 = Enabled
FixUpgradeCursorLeak = 1

; Fixes the Pinball Cannon button prompt for PC
; 0 = Disabled, 1 = Enabled
FixPinballCannonPrompt = 1

; Prevents save-file corruption and keeps a backup (.bak) of your save
; 0 = Disabled, 1 = Enabled
AtomicSaves = 1

; Caps the engine's background worker thread pool
; -1 = Disabled
MaxPoolThreads = 8

; Replaces the game's XAudio 2.6 audio engine with XAudio 2.9 at runtime
; Uses the system XAudio 2.9 on Windows 10/11, on Windows 7/8 place
; xaudio2_9redist.dll next to the game. Falls back to the original
; XAudio 2.6 automatically when 2.9 is not available.
; 0 = Disabled, 1 = Enabled
UpgradeToXAudio29 = 1

[General]
; Unlocks Complete Edition DLC content
; 0 = Disabled, 1 = Enabled
UnlockCompleteEditionDLC = 1

; Show achievement progress and unlock notifications in-game (press HOME to open the list)
; 0 = Disabled, 1 = Enabled
AchievementSupport = 1

; Show the profile creation/selection screen at startup
; 0 = Disabled (skip straight to the menu), 1 = Enabled
ShowProfileCreation = 1

; Displays a warning prompt if American McGee's Alice (Alice1) is not found in the expected installation directory when attempting to launch it
; 0 = Disabled, 1 = Enabled
WarnAlice1InstallFolder = 1

; Removes the American McGee's Alice (Alice1) entry from the in-game menus when it is not installed
; 0 = Disabled, 1 = Enabled
HideAlice1WhenMissing = 1

; Enable the in-game developer console, bound to the F2 key
; 0 = Disabled, 1 = Enabled
EnableConsole = 1

; Installs a crash handler to generate detailed crash logs (crash_YYYYMMDD.txt)
; Helpful for diagnosing game instability
; 0 = Disabled, 1 = Enabled
EnableCrashHandler = 1

; Skip EA logo intro video on game launch
; 0 = Disabled, 1 = Enabled
SkipEAIntro = 0

; Skip Spicy Horse logo intro video on game launch
; 0 = Disabled, 1 = Enabled
SkipSHIntro = 1

; Skip Unreal Engine logo intro video on game launch
; 0 = Disabled, 1 = Enabled
SkipUEIntro = 1

[Modding]
; Write the game's assets into an "archive_dump" folder as they are loaded
; 0 = Disabled, 1 = Enabled
DumpArchiveAssets = 0

; Replace assets with loose files from "mods\<mod name>", laid out like the dump
; Note: Materials are not replaced from .bin, they only work inside their own package
; 0 = Disabled, 1 = Enabled
LoadModFiles = 1

[Display]
; Enables subtitle font scaling for resolutions above 720p
; Automatically adjusts subtitle size for high-resolution displays
; 0 = Disabled, 1 = Enabled
FontScaling = 1

; Manual subtitle font size multiplier
FontScalingFactor = 1.0

; Automatically detects and sets optimal screen resolution on first start
; 0 = Disabled, 1 = Enabled
AutoResolution = 1

; Forces the game to run in windowed mode instead of fullscreen
; 0 = Disabled, 1 = Enabled
UseWindowed = 0

[Input]
; Override XInput with SDL controller handling
; 0 = Disabled, 1 = Enabled
UseSDLControllerInput = 1

; Replace keyboard/mouse button prompts with controller button icons (only when a controller is connected)
; 0 = Disabled, 1 = Enabled
EnableControllerIcons = 1

; Switch to using PS3 controller icons instead of Xbox controller icons
; 0 = Auto-Detect, 1 = Xbox 360 icons, 2 = PS3 icons
UsePS3ControllerIcons = 0

; Disables mouse acceleration for consistent 1:1 mouse movement
; 0 = Disabled, 1 = Enabled
DisableMouseAcceleration = 1

; Disables analog stick acceleration on controllers
; 0 = Disabled, 1 = Enabled
DisableControllerAcceleration = 1

; Enable Touchpad mouse emulation
; 0 = Disabled, 1 = Enabled
TouchpadEnabled = 0

; Swap A/B and X/Y button mappings for Nintendo controllers
; 0 = Disabled, 1 = Enabled
InvertABXYButtons = 1

; Use the intended binding for Playstation controllers
; 0 = Disabled, 1 = Enabled
InvertShoulderTriggers = 1

; Disables mouse smoothing for more responsive and immediate input
; 0 = Disabled, 1 = Enabled
DisableMouseSmoothing = 0

; Changes in-game cutscene skip key from Space to Enter
; Require 'FixInputBinding' to be enabled
; 0 = Disabled, 1 = Enabled
SkipCutscenesWithEnter = 1

[Graphics]
; Sets custom framerate limit
; 0 = No limit (uses game default)
; Recommended maximum: 120 FPS to avoid issues
MaxFPS = 120

; Forces highest texture resolution at all times to eliminate pop-in artifacts
; May increase VRAM usage and impact performance on systems with limited memory
; 0 = Disabled, 1 = Enabled
ForceHighResTextures = 1

; Improves texture streaming system to reduce visible texture pop-in
; 0 = Disabled, 1 = Enabled
ImprovedTextureStreaming = 1

; Disables background level streaming during gameplay to prevent stuttering
; Will increase loading times
; 0 = Disabled, 1 = Enabled
DisableBackgroundLevelStreaming = 1

; Adjusts viewport and field of view calculations for ultrawide aspect ratios
; 0 = Disabled, 1 = Enabled
FixAspectRatio = 1

; Reduces texture mipmap bias for improved texture sharpness at a distance
; 0 = Disabled, 1 = Enabled
ReducedMipMapBias = 1

; Applies correct color space (BT.709) to Bink video playback instead of BT.601
; 0 = Disabled, 1 = Enabled
FixBinkVideoBT709 = 1

; Automatically adjusts PhysX GPU heap and mesh cache sizes based on available VRAM
; 0 = Disabled, 1 = Enabled
AdaptivePhysXMemory = 1

